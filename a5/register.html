
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ville Heikkiniemi">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <title>My Cat - Register</title>
</head>

<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="register.html"><strong>Register</strong></a>
    </nav>

    <main class="register">
        <h1>Register to Site</h1>

        <p>
            Create an account to sell your soul to Sherlock.
            Fill in the information below to register!!!
        </p>

        <form action="https://httpbin.org/post" method="post">
            <div class="form-group">
                <label for="email">Email address:</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="name">Full name:</label>
                <input type="text" id="name" name="name" required>
            </div>


            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username"
                    minlength="3" required>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password"
                    minlength="8" required>
            </div>

            <div class="form-group">
                <label for="usertype">Choose your user type:</label>
                <select id="usertype" name="usertype" required>
                    <option value="" disabled selected>Select user type</option>
                    <option value="cat_fan">Cat fan</option>
                    <option value="cat_owner">Cat owner</option>
                    <option value="animal_lover">Mystery Option</option>
                </select>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="terms" name="terms"
                    value="accepted" required>
                <label for="terms">
                    I accept the terms and conditions.
                </label>
            </div>

            <p class="terms">
                By registering, you lose your soul.
            </p>

            <button type="submit">Register</button>

        </form>
    </main>
</body>

</html>
